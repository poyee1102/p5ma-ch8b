<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="面積魔術師：多邊形" />
  <title>面積魔術師：多邊形（填補法）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #ff7eb6; --pink-deep: #ee4d93;
      --sky: #5cc8ff; --sky-deep: #2a9adf;
      --lemon: #ffe066; --lemon-deep: #e4b82a;
      --lilac: #c9b6ff; --lilac-deep: #9b7af0;
      --mint: #7eecc8; --mint-deep: #3cbc9a;
      --ink: #1d3a5c; --soft: #5d7590;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0;
      font-family: "Noto Sans TC", "PingFang HK", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 186, 206, 0.5) 0%, rgba(255, 186, 206, 0) 36%),
        linear-gradient(125deg, rgba(255, 210, 222, 0.72) 0%, rgba(255, 210, 222, 0) 48%),
        linear-gradient(200deg, rgba(255, 196, 214, 0.38) 10%, rgba(255, 196, 214, 0) 52%),
        linear-gradient(165deg, #fff7f8 0%, #ffd9e4 40%, #ffe8ef 70%, #fffafb 100%);
      user-select: none;
    }
    .fun-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .deco { position: absolute; }
    .deco svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .deco-lt { top: 4%; left: 11%; width: 34vmin; aspect-ratio: 200 / 173; transform: rotate(-16deg); }
    .deco-lbl { top: 36%; left: 1%; width: 32vmin; aspect-ratio: 180 / 160; transform: rotate(14deg); }
    .deco-lbr { top: 68%; left: 13%; width: 28vmin; aspect-ratio: 180 / 200; transform: rotate(-10deg); }
    .deco-rt { top: 6%; right: 2%; width: 32vmin; aspect-ratio: 200 / 176; transform: rotate(18deg); }
    .deco-rbl { top: 38%; right: 11%; width: 34vmin; aspect-ratio: 200 / 160; transform: rotate(-18deg); }
    .deco-rbr { top: 70%; right: 3%; width: 36vmin; aspect-ratio: 232 / 150; transform: rotate(12deg); }
    button, input { font-family: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    input { user-select: text; -webkit-user-select: text; }

    @keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes bounce { 0% { transform: scale(1); } 35% { transform: scale(0.88); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .bounce { animation: bounce 0.35s ease; }
    .shake { animation: shake 0.4s ease; }

    .app {
      position: relative; z-index: 1;
      height: 100%; width: 100%; overflow: hidden; display: flex;
      padding: calc(6px + var(--safe-t)) calc(8px + var(--safe-r)) calc(6px + var(--safe-b)) calc(8px + var(--safe-l));
    }
    .screen {
      display: none; width: min(1280px, 100%); margin: 0 auto;
      height: 100%; min-height: 0; flex-direction: column; overflow: hidden;
      animation: popIn 0.35s ease;
    }
    .screen.active { display: flex; }
    .card {
      background: rgba(255,255,255,0.92); border: 3px solid #fff; border-radius: 26px;
      box-shadow: 0 14px 30px rgba(196, 80, 120, 0.16); min-height: 0; color: var(--ink);
    }
    .candy {
      border: 0; border-radius: 999px; font-weight: 900; padding: 10px 18px;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .candy:hover { filter: brightness(1.05); }
    .candy:active { transform: translateY(4px) scale(0.96); box-shadow: 0 2px 0 rgba(0,0,0,0.18) !important; animation: bounce 0.3s ease; }
    .candy:disabled { filter: saturate(0.55); pointer-events: none; }
    .sky { background: var(--sky); color: #0a3a5c; box-shadow: 0 6px 0 var(--sky-deep); }
    .pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-deep); }
    .lemon { background: var(--lemon); color: var(--ink); box-shadow: 0 6px 0 var(--lemon-deep); }
    .mint { background: var(--mint); color: #165f4c; box-shadow: 0 6px 0 var(--mint-deep); }
    .lilac { background: var(--lilac); color: #fff; box-shadow: 0 6px 0 var(--lilac-deep); }
    .ghost { background: #fff; color: var(--soft); box-shadow: 0 5px 0 #d5e4f2; }

    #screen-login, #screen-mode { align-items: center; justify-content: center; }
    .login { width: min(400px, 100%); padding: 22px 18px 16px; text-align: center; }
    .mode-card { width: min(420px, 100%); }
    .mascot {
      width: 72px; height: 72px; margin: 0 auto 6px; border-radius: 50%;
      display: grid; place-items: center; font-size: 36px; background: #fff;
      box-shadow: 0 8px 0 #f3c3d2;
      animation: floaty 2.8s ease-in-out infinite;
    }
    .mascot svg { width: 44px; height: auto; display: block; }
    .title {
      font-family: "Fredoka", "Noto Sans TC", sans-serif;
      font-size: clamp(20px, 4.4vh, 30px); font-weight: 900; letter-spacing: 0.03em;
      margin-bottom: 14px; line-height: 1.3; white-space: normal;
      background: none; border: 0; box-shadow: none; padding: 0; text-shadow: none;
    }
    .title span:nth-child(odd) { color: var(--pink-deep); }
    .title span:nth-child(even) { color: var(--lilac-deep); }
    .field { text-align: left; margin-bottom: 10px; }
    .field label { display: block; font-weight: 900; font-size: 15px; margin-bottom: 4px; }
    .field input {
      width: 100%; border: 3px solid #ffe1ec; border-radius: 16px;
      padding: 10px 12px; font-size: 18px; font-weight: 800; outline: none; background: #fff;
    }
    .field input:focus { border-color: var(--pink); }
    .start { width: 100%; font-size: 22px; padding: 12px; margin: 6px 0 10px; }
    .teacher-btn {
      width: 64px; height: 64px; border-radius: 50%; font-size: 13px; line-height: 1.15;
      padding: 0; margin: 4px auto 0; display: grid; place-items: center;
    }
    .login-acts {
      display: flex; flex-wrap: nowrap; justify-content: center; align-items: center;
      gap: 22px; margin-top: 4px;
    }
    .login-acts .teacher-btn {
      margin: 0; padding: 0; width: 64px; height: 64px; min-width: 64px;
      flex: 0 0 64px; font-size: 13px; line-height: 1.2;
    }
    .mode-h { font-size: clamp(22px, 3.2vh, 28px); margin-bottom: 14px; }
    .mode-acts { display: flex; flex-direction: column; gap: 10px; }
    .mode-acts .candy { width: 100%; font-size: 22px; padding: 14px; }
    .mode-back { margin-top: 12px; }
    .rank-note {
      flex-shrink: 0; font-family: "Fredoka", "Noto Sans TC", sans-serif;
      font-weight: 900; font-size: clamp(24px, 3.6vh, 32px); line-height: 1.3;
      color: var(--pink-deep); text-align: center; letter-spacing: 0.04em;
    }
    tr.r1 td { background: #fff6c9; }
    tr.r2 td { background: #eef2f7; }
    tr.r3 td { background: #f8ead8; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; margin-bottom: 4px; overflow: visible; }
    .pill {
      background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 12px;
      font-weight: 800; font-size: 16px; box-shadow: 0 4px 0 #d5e4f2; white-space: nowrap;
    }
    .timer-wrap { position: relative; flex-shrink: 0; }
    .timer { font-variant-numeric: tabular-nums; background: #e7f3ff; min-width: 92px; text-align: center; }
    .timer.hit { background: #ffd0d8; color: #b42318; animation: shake 0.4s ease; }
    .time-hit {
      position: absolute; left: 50%; top: 50%; z-index: 3;
      font-weight: 900; font-size: 16px; color: #b42318;
      pointer-events: none; opacity: 0; white-space: nowrap;
      text-shadow: 0 1px 0 #fff, 0 0 8px #fff;
    }
    .time-hit.show { animation: timeHitPop 0.7s ease; }
    @keyframes timeHitPop {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
      22% { opacity: 1; transform: translate(-50%, -110%) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -160%) scale(0.96); }
    }
    .tiny { padding: 6px 12px; font-size: 13px; }

    .play { flex: 1; min-height: 0; overflow: hidden; padding: 6px; display: flex; flex-direction: column; gap: 4px; background: #fff; }
    #screen-mode .card { background: #fff; }
    .task-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-shrink: 0; }
    .task-h h2 { font-size: clamp(18px, 2.8vh, 24px); line-height: 1.3; }
    .task-h p { font-size: 16px; font-weight: 900; color: var(--soft); white-space: nowrap; }
    .hintbar {
      flex-shrink: 0; font-size: clamp(18px, 3vh, 22px); font-weight: 900; color: #5a4a72;
      background: #e8fff6; border-radius: 12px; padding: 8px 12px; text-align: center;
      line-height: 1.35; white-space: normal; overflow: hidden;
    }
    .hintbar.bad { background: #ffe8ee; color: #9d2340; }
    .board {
      flex: 1; min-height: 0; position: relative;
      display: flex; align-items: stretch; justify-content: center;
      background: #fff;
      border-radius: 22px; overflow: hidden;
      box-shadow: inset 0 0 0 2px rgba(200, 110, 140, 0.35);
      touch-action: none;
    }
    .board::before, .board::after {
      content: ""; position: absolute; width: 54px; height: 14px; z-index: 2; pointer-events: none;
      background: #ffe066;
      box-shadow: 0 2px 0 rgba(228, 184, 42, 0.35);
    }
    .board::before { top: 10px; left: 4px; transform: rotate(-45deg); }
    .board::after { top: 12px; right: 4px; transform: rotate(45deg); }
    #scene { width: 100%; height: 100%; display: block; touch-action: none; position: relative; z-index: 0; }

    .work { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
    .piece-row { display: flex; gap: 8px; align-items: flex-start; }
    .slot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .lab { font-weight: 900; font-size: 15px; line-height: 1.2; white-space: nowrap; }
    .box {
      min-height: 44px; border: 3px solid #d5e6f8; border-radius: 12px;
      background: #fff; font-weight: 800; font-size: clamp(18px, 2.5vh, 22px); padding: 6px 10px;
      text-align: left; overflow: hidden; white-space: normal; line-height: 1.25;
    }
    .box.on { border-color: #2a7de1; }
    .box.ok { border-color: #3cbc9a; background: #f3fffb; }
    .eq-row { display: flex; align-items: stretch; gap: 6px; }
    .eq-row .box { flex: 1.6; min-width: 0; }
    .eq-row .box.ans { flex: 0.62; text-align: center; }
    .eq-row.picks { gap: 4px; flex-wrap: nowrap; }
    .eq-row.picks select.box {
      flex: 1 1 0; appearance: none; -webkit-appearance: none; cursor: pointer;
      text-align: center; font-family: inherit; color: inherit;
      font-size: clamp(14px, 1.9vh, 18px); padding: 4px 18px 4px 6px;
      background-image: linear-gradient(45deg, transparent 50%, #1d3a5c 50%), linear-gradient(135deg, #1d3a5c 50%, transparent 50%);
      background-position: calc(100% - 12px) calc(50% - 2px), calc(100% - 7px) calc(50% - 2px);
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; background-color: #fff;
    }
    .eq-row.picks select.box.op { flex: 0 0 58px; padding-left: 2px; padding-right: 16px; }
    .eq-row.picks .box.ans { flex: 0 0 120px; white-space: nowrap; }
    .eq-row .box.ans.wait { opacity: 0.45; pointer-events: none; }
    .eq-row.picks select.box:disabled { cursor: default; opacity: 1; }
    .eq { flex: 0 0 auto; align-self: center; font-weight: 900; font-size: clamp(20px, 2.6vh, 26px); line-height: 1; }
    .slot.wait { opacity: 0.55; }
    .under { font-size: 13px; font-weight: 800; color: #6a7f93; line-height: 1.3; }
    .under.faint { color: #c3ced8; }
    .keypad { flex-shrink: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
    .keypad.finish { display: flex; align-items: center; gap: 8px; }
    .keypad.finish .miss-line {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;
      background: #ffe566; border: 2px solid #e8b423; border-radius: 14px;
      box-shadow: 0 3px 0 #e0b020; padding: 6px 12px 7px;
      font-size: 15px; font-weight: 900; line-height: 1.35; color: var(--ink);
    }
    .keypad.finish .miss-h { line-height: 1.3; }
    .keypad.finish .miss-item { line-height: 1.35; }
    .keypad.finish .key { flex: 0 0 auto; width: auto; padding: 0 16px; white-space: nowrap; }
    .key {
      height: 40px; border-radius: 12px; font-weight: 900; font-size: 18px; padding: 0;
      background: #fff; color: var(--ink); box-shadow: 0 4px 0 #d5e4f2;
    }
    .key.go { background: var(--mint); color: #165f4c; box-shadow: 0 4px 0 var(--mint-deep); }
    .key.del { font-size: 15px; }
    .key.op { background: #e7f3ff; }

    .report {
      position: fixed; inset: 0; background: rgba(29, 58, 92, 0.42);
      display: none; place-items: center; z-index: 25; padding: 16px;
    }
    .report.show { display: grid; }
    .report-card {
      width: min(520px, 100%); background: #fff; border-radius: 32px;
      padding: 22px 20px 18px; text-align: center; border: 4px solid #fff;
      box-shadow: 0 18px 40px rgba(196, 90, 120, 0.28); animation: popIn 0.4s ease; color: var(--ink);
    }
    .report-card h2 { font-size: clamp(22px, 3.4vh, 28px); margin: 8px 0 10px; }
    .report-card p { font-weight: 800; line-height: 1.55; margin: 8px 0; font-size: 16px; }
    .tip {
      background: #e8fff6; border-radius: 18px; padding: 12px 14px; margin: 12px 0 16px;
      font-weight: 800; line-height: 1.6; text-align: left; white-space: pre-wrap;
    }

    .dash-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-shrink: 0; margin-bottom: 8px; }
    .dash-h h1 { font-family: "Fredoka", "Noto Sans TC", sans-serif; font-size: clamp(20px, 3vh, 28px); color: var(--ink); }
    .dash-h .acts { display: flex; gap: 8px; margin: 0; }
    .dash { flex: 1; min-height: 0; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex-shrink: 0; }
    .stat { border-radius: 16px; padding: 10px; }
    .stat b { display: block; font-size: 12px; opacity: 0.8; }
    .stat strong { font-size: clamp(16px, 2.6vh, 24px); display: block; line-height: 1.2; }
    .stat .miss3 { font-size: 13px; font-weight: 800; line-height: 1.45; }
    .s1 { background: #d9f8ee; } .s2 { background: #ffe1ea; } .s3 { background: #e5f2ff; }
    .tools { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 8px; flex-wrap: wrap; }
    .tools select, .tools button.tiny { border: 2px solid #ffe1ec; border-radius: 12px; padding: 4px 8px; font-weight: 800; background: #fff; }
    .tool-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .dash-src, .dash-count { font-size: 12px; font-weight: 800; color: var(--soft); }
    .records { flex: 1; min-height: 0; overflow: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(16,36,63,0.08); font-size: 12px; }
    th { background: #e8fff6; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
    th.col-h { padding-right: 4px; }
    .col-sort { border: 0; background: transparent; font: inherit; font-weight: 900; cursor: pointer; padding: 0; }
    th.sorted .col-sort { color: #2a7de1; }
    .filter-btn {
      border: 0; background: #d9ecff; color: var(--ink); cursor: pointer;
      border-radius: 8px; width: 22px; height: 22px; margin-left: 4px;
      font-size: 12px; font-weight: 900; line-height: 1; vertical-align: middle;
    }
    .filter-btn.on { background: #2a7de1; color: #fff; }
    .score-cell { font-variant-numeric: tabular-nums; font-weight: 900; text-align: center; }
    th.score-h, td.rank-cell { text-align: center; font-variant-numeric: tabular-nums; }
    tr.hi .score-cell { color: #1a8f7c; }
    tr.lo .score-cell { color: #b42318; }
    .diag-cell { white-space: pre-line; }
    .empty { text-align: center; padding: 20px; font-weight: 800; color: var(--soft); }
    .filter-menu {
      position: fixed; z-index: 30; width: min(280px, calc(100vw - 16px));
      background: #fff; border-radius: 18px; padding: 10px;
      box-shadow: 0 16px 36px rgba(29,58,92,0.24); border: 2px solid #d5e6f8;
      display: none; flex-direction: column; gap: 8px; max-height: min(420px, 70vh);
    }
    .filter-menu.show { display: flex; }
    .filter-menu .fm-title { font-weight: 900; font-size: 14px; text-align: left; }
    .filter-menu .fm-acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-menu .fm-acts button {
      border: 0; border-radius: 999px; font-weight: 900; padding: 6px 10px; font-size: 12px;
      background: #e8fff6; color: var(--ink); cursor: pointer;
    }
    .filter-menu input[type="search"] {
      width: 100%; border: 2px solid #d5e6f8; border-radius: 12px;
      padding: 6px 8px; font-weight: 800; font-size: 14px;
    }
    .filter-menu .opts { overflow: auto; text-align: left; flex: 1; min-height: 80px; }
    .filter-menu label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 2px; font-weight: 800; font-size: 13px; cursor: pointer; }
    .filter-menu label input { margin-top: 2px; }

    .modal { position: fixed; inset: 0; background: rgba(29,58,92,0.4); display: none; place-items: center; z-index: 20; padding: 16px; }
    .modal.show { display: grid; }
    .modal-card { width: min(360px, 100%); background: #fff; border-radius: 24px; padding: 18px; text-align: center; color: var(--ink); }
    .modal-card input {
      width: 100%; border: 3px solid #ffe1ec; border-radius: 14px;
      padding: 10px; font-size: 20px; font-weight: 800; text-align: center; margin: 10px 0;
    }
    .choice-row { display: flex; gap: 8px; }
    .choice-row .candy { flex: 1; font-size: 18px; padding: 12px 8px; }
    canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

    @media (max-height: 720px) {
      .mascot { width: 56px; height: 56px; }
      .mascot svg { width: 34px; }
      .teacher-btn, .login-acts .teacher-btn { width: 52px; height: 52px; min-width: 52px; flex-basis: 52px; font-size: 12px; }
      .mode-acts .candy { padding: 8px; font-size: 18px; }
      .hintbar { font-size: 16px; padding: 6px 10px; }
      .key { height: 32px; font-size: 15px; }
      .key.del { font-size: 13px; }
      .box { min-height: 36px; font-size: 16px; padding: 4px 8px; }
      .eq { font-size: 18px; }
      .lab { font-size: 14px; }
      .under { font-size: 12px; }
      .stat .miss3 { font-size: 12px; line-height: 1.35; }
      .task-h h2 { font-size: 16px; }
      .play { padding: 4px; gap: 3px; }
      .keypad.finish .miss-line { font-size: 13px; padding: 4px 8px 5px; border-radius: 12px; }
    }
    @media print {
      html, body, .app, .screen.active { position: static; height: auto; overflow: visible; }
      .no-print, canvas, .report, .modal, .filter-menu, .filter-btn, .fun-bg { display: none !important; }
      .records { overflow: visible; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="fun-bg" aria-hidden="true">
    <div class="deco deco-lt"><svg viewBox="0 0 200 173" preserveAspectRatio="xMidYMid meet"><polygon points="16,156 184,156 184,48 136,48 100,104 64,48 16,48" fill="#ff7eb6" fill-opacity="0.65"/></svg></div>
    <div class="deco deco-lbl"><svg viewBox="0 0 180 160" preserveAspectRatio="xMidYMid meet"><polygon points="18,142 130,142 162,18 129,18 116,68 70,68 83,18 50,18" fill="#ffe066" fill-opacity="0.62"/></svg></div>
    <div class="deco deco-lbr"><svg viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet"><polygon points="22,186 158,186 136,52 110,52 90,108 70,52 44,52" fill="#7eecc8" fill-opacity="0.65"/></svg></div>

          const cross = p[0] * q[1] - q[0] * p[1];

          return [Math.round(x / poly.length * 100) / 100, Math.round(y / poly.length * 100) / 100];

        return [Math.round(cx * k * 100) / 100, Math.round(cy * k * 100) / 100];

              const len = Math.hypot(pb[0] - pa[0], pb[1] - pa[1]) || 1;
              const amx = (spot.ax1 + spot.ax2) / 2, amy = (spot.ay1 + spot.ay2) / 2;
              const adx = spot.ax2 - spot.ax1, ady = spot.ay2 - spot.ay1;
              const alen = Math.hypot(adx, ady) || 1;
              const alongA = ((spot.x - amx) * adx + (spot.y - amy) * ady) / alen;
              const perpA = Math.abs((spot.x - amx) * (-ady) + (spot.y - amy) * adx) / alen;
              if (Math.abs(alongA) > 8) bad.push(i + spot.t + ":acen");
              if (perpA < 4 || perpA > 48) bad.push(i + spot.t + ":agap" + Math.round(perpA));
              if (Math.abs(alen - len) > 2.5) bad.push(i + spot.t + ":alen");
            }
            if (rect.l < state.view.mid + 2 || rect.t < 26 || rect.r > state.cssW + 2 || rect.b > state.cssH + 2) bad.push(i + spot.t + ":clip");
          });
          for (let i = 0; i < spots.length; i++) {
            for (let j = i + 1; j < spots.length; j++) {
              const a = { l: spots[i].x - spots[i].hw, t: spots[i].y - spots[i].up, r: spots[i].x + spots[i].hw, b: spots[i].y + spots[i].down };
              const b = { l: spots[j].x - spots[j].hw, t: spots[j].y - spots[j].up, r: spots[j].x + spots[j].hw, b: spots[j].y + spots[j].down };
              if (a.l < b.r - 1 && b.l < a.r - 1 && a.t < b.b - 1 && b.t < a.b - 1) bad.push(spots[i].t + "/" + spots[j].t);
              if (spots[i].seg && spots[j].seg && segOverlapLen(spots[i].seg, spots[j].seg) > 0.35) {
                const longer = spots[i].seg.len >= spots[j].seg.len ? spots[i] : spots[j];
                const shorter = longer === spots[i] ? spots[j] : spots[i];
                if (longer.seg.len > shorter.seg.len + 0.4 && !longer.arrow) bad.push(longer.t + ":needarrow");
              }
            }
          }
          if (bad.length) {
            const detail = spots.map((s) => s.t + "@" + Math.round(s.x) + "," + Math.round(s.y)).join(" ");
            fails.push("split:" + (q.sig || q.name) + ":" + bad.join(",") + " [" + detail + " mid" + Math.round(state.view.mid) + " s" + Math.round(state.view.s) + "]");
          }
        });
        return fails.length ? "FAIL " + fails.join(" | ") : "PASS";
      }
    })();
  </script>
